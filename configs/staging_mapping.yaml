      customer_zip_code_prefix:
        target: customer_zip_code_prefix
        dtype: integer
      customer_city:
        target: customer_city
        dtype: string
      customer_state:
        target: customer_state
        dtype: string

  products:
    source_file: olist_products_dataset.csv
    staging_name: stg_products
    columns:
      product_id:
        target: product_id
        dtype: string
      product_category_name:
        target: product_category_name
        dtype: string
      product_name_lenght:
