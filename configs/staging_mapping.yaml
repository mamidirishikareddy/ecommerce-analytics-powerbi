        dtype: integer
      seller_city:
        target: seller_city
        dtype: string
      seller_state:
        target: seller_state
        dtype: string

  geolocation:
    source_file: olist_geolocation_dataset.csv
    staging_name: stg_geolocation
    columns:
      geolocation_zip_code_prefix:
        target: geolocation_zip_code_prefix
        dtype: integer
      geolocation_lat:
        target: geolocation_lat
        dtype: decimal
      geolocation_lng:
        target: geolocation_lng
        dtype: decimal
      geolocation_city:
        target: geolocation_city
        dtype: string
      geolocation_state:
        target: geolocation_state
        dtype: string

  category_translation:
