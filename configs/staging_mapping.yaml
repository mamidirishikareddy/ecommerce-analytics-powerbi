version: "1.0"

datasets:

  orders:
    source_file: olist_orders_dataset.csv
    staging_name: stg_orders
    columns:
      order_id:
        target: order_id
        dtype: string
      customer_id:
        target: customer_id
        dtype: string
      order_status:
        target: order_status
        dtype: string
      order_purchase_timestamp:
        target: order_purchase_timestamp
        dtype: datetime
      order_approved_at:
        target: order_approved_at
        dtype: datetime
      order_delivered_carrier_date:
        target: order_delivered_carrier_date
        dtype: datetime
      order_delivered_customer_date:
        target: order_delivered_customer_date
        dtype: datetime
      order_estimated_delivery_date:
        target: order_estimated_delivery_date
        dtype: datetime

  order_items:
    source_file: olist_order_items_dataset.csv
    staging_name: stg_order_items
    columns:
      order_id:
        target: order_id
        dtype: string
      order_item_id:
        target: order_item_id
        dtype: integer
      product_id:
        target: product_id
        dtype: string
      seller_id:
        target: seller_id
        dtype: string
      shipping_limit_date:
        target: shipping_limit_date
        dtype: datetime
      price:
        target: price
        dtype: decimal
      freight_value:
        target: freight_value
        dtype: decimal

  payments:
    source_file: olist_order_payments_dataset.csv
    staging_name: stg_payments
    columns:
      order_id:
        target: order_id
        dtype: string
      payment_sequential:
        target: payment_sequential
        dtype: integer
      payment_type:
        target: payment_type
        dtype: string
      payment_installments:
        target: payment_installments
        dtype: integer
      payment_value:
        target: payment_value
        dtype: decimal

  reviews:
    source_file: olist_order_reviews_dataset.csv
    staging_name: stg_reviews
    columns:
      review_id:
        target: review_id
        dtype: string
      order_id:
        target: order_id
        dtype: string
      review_score:
        target: review_score
        dtype: integer
      review_comment_title:
        target: review_comment_title
        dtype: string
      review_comment_message:
        target: review_comment_message
        dtype: string
      review_creation_date:
        target: review_creation_date
        dtype: datetime
      review_answer_timestamp:
        target: review_answer_timestamp
        dtype: datetime

  customers:
    source_file: olist_customers_dataset.csv
    staging_name: stg_customers
    columns:
      customer_id:
        target: customer_id
        dtype: string
      customer_unique_id:
        target: customer_unique_id
