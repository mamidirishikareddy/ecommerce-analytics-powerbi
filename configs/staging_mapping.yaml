      product_height_cm:
        target: product_height_cm
        dtype: decimal
      product_width_cm:
        target: product_width_cm
        dtype: decimal

  sellers:
    source_file: olist_sellers_dataset.csv
    staging_name: stg_sellers
    columns:
      seller_id:
