version: "1.0"

warehouse_mapping:

  facts:

    fact_order:
      source_staging: stg_orders
      grain: one row per order
      business_key:
        - order_id
      transformation: direct_mapping
      generated_columns: []
      columns:
        order_id: order_id
        customer_id: customer_id
        order_status: order_status
        order_purchase_timestamp: order_purchase_timestamp
        order_approved_at: order_approved_at
        order_delivered_carrier_date: order_delivered_carrier_date
        order_delivered_customer_date: order_delivered_customer_date
        order_estimated_delivery_date: order_estimated_delivery_date

    fact_order_item:
      source_staging: stg_order_items
      grain: one row per order item line
      business_key:
        - order_id
        - order_item_id
      transformation: direct_mapping
      generated_columns: []
      columns:
        order_id: order_id
        order_item_id: order_item_id
        product_id: product_id
        seller_id: seller_id
        shipping_limit_date: shipping_limit_date
        price: price
        freight_value: freight_value

    fact_payment:
      source_staging: stg_payments
      grain: one row per payment sequence within an order
      business_key:
        - order_id
        - payment_sequential
      transformation: direct_mapping
      generated_columns: []
      columns:
        order_id: order_id
        payment_sequential: payment_sequential
        payment_type: payment_type
        payment_installments: payment_installments
        payment_value: payment_value

    fact_review:
      source_staging: stg_reviews
      grain: one row per review record associated with an order
      business_key:
        - review_id
        - order_id
      transformation: direct_mapping
      generated_columns: []
      columns:
        review_id: review_id
        order_id: order_id
        review_score: review_score
        review_comment_title: review_comment_title
        review_comment_message: review_comment_message
        review_creation_date: review_creation_date
        review_answer_timestamp: review_answer_timestamp

  dimensions:

    dim_date:
      source_staging: []
      grain: one row per calendar date
      business_key:
        - date
      transformation: generated_calendar
      generated_columns:
        - date
        - year
        - quarter
        - month
        - month_name
        - day
        - day_of_week
        - day_name
        - week_of_year
      columns: {}

    dim_customer:
      source_staging: stg_customers
      grain: one row per customer-order identifier
      business_key:
        - customer_id
      transformation: direct_mapping
      generated_columns: []
      columns:
        customer_id: customer_id
        customer_unique_id: customer_unique_id
        customer_zip_code_prefix: customer_zip_code_prefix
        customer_city: customer_city
        customer_state: customer_state

    dim_product:
      source_staging: stg_products
      grain: one row per product
      business_key:
        - product_id
      transformation: direct_mapping
      generated_columns: []
      columns:
        product_id: product_id
        product_category_name: product_category_name
        product_name_length: product_name_length
        product_description_length: product_description_length
        product_photos_qty: product_photos_qty
        product_weight_g: product_weight_g
        product_length_cm: product_length_cm
        product_height_cm: product_height_cm
        product_width_cm: product_width_cm

    dim_seller:
      source_staging: stg_sellers
      grain: one row per seller
      business_key:
        - seller_id
      transformation: direct_mapping
      generated_columns: []
      columns:
        seller_id: seller_id
        seller_zip_code_prefix: seller_zip_code_prefix
        seller_city: seller_city
        seller_state: seller_state

    dim_category:
      source_staging: stg_category_translation
      grain: one row per translated product category
      business_key:
        - product_category_name
      transformation: direct_mapping
      generated_columns: []
      columns:
        product_category_name: product_category_name
        product_category_name_english: product_category_name_english

    dim_geography:
      source_staging: stg_geolocation
      grain: one row per geolocation observation
      business_key: []
      transformation: direct_mapping
      generated_columns: []
      columns:
        geolocation_zip_code_prefix: geolocation_zip_code_prefix
        geolocation_lat: geolocation_lat
        geolocation_lng: geolocation_lng
        geolocation_city: geolocation_city
        geolocation_state: geolocation_state