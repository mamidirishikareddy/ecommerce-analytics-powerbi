version: "1.0"

name: mart_customer_voice_monthly

purpose: >
  Governed monthly analytical mart for customer voice intelligence.
  Combines review-level sentiment and complaint enrichment into business
  metrics suitable for analytical SQL and Power BI consumption.

grain:
  description: >
    One row per calendar month.

  business_key:
    - month

source_tables:
  - data/processed/nlp/customer_voice.parquet
  - data/processed/nlp/customer_voice_complaints.parquet

time_dimension:
  field: month
  source: review_creation_date
  granularity: month

metrics:

  - name: review_count
    definition: >
      Count of unique review records identified by review_id + order_id.

  - name: text_review_count
    definition: >
      Count of review records containing usable review text.

  - name: text_coverage_pct
    definition: >
      Text-bearing reviews divided by total reviews multiplied by 100.

  - name: average_review_score
    definition: >
      Arithmetic mean of review_score across reviews in the month.

  - name: negative_review_rate_pct
    definition: >
      Text-bearing reviews classified as negative by the governed sentiment
      layer divided by text-bearing reviews multiplied by 100.

  - name: positive_review_rate_pct
    definition: >
      Text-bearing reviews classified as positive by the governed sentiment
      layer divided by text-bearing reviews multiplied by 100.

  - name: neutral_review_rate_pct
    definition: >
      Text-bearing reviews classified as neutral by the governed sentiment
      layer divided by text-bearing reviews multiplied by 100.

  - name: complaint_volume
    definition: >
      Count of text-bearing review records classified as complaints by the
      governed complaint detection layer.

  - name: complaint_rate_pct
    definition: >
      Complaint volume divided by text-bearing reviews multiplied by 100.

  - name: complaint_theme_volume
    definition: >
      Count of complaints by governed primary complaint theme.

  - name: complaint_theme_share_pct
    definition: >
      Complaint volume for a theme divided by total complaint volume
      multiplied by 100.

diagnostics:

  - complaint_volume_growth_pct
  - complaint_rate_change_pct
  - average_review_score_change
  - negative_review_rate_change_pct
  - sentiment_distribution
  - complaint_theme_distribution

required_source_fields:

  customer_voice:
    - review_id
    - order_id
    - review_score
    - review_creation_date
    - has_review_text
    - sentiment
    - sentiment_confidence

  complaint_intelligence:
    - review_id
    - order_id
    - complaint_flag
    - complaint_confidence
    - complaint_theme
    - complaint_theme_confidence
    - complaint_detection_method

output_columns:

  - month
  - review_count
  - text_review_count
  - text_coverage_pct
  - average_review_score
  - positive_review_rate_pct
  - negative_review_rate_pct
  - neutral_review_rate_pct
  - complaint_volume
  - complaint_rate_pct

grain_rules:
  review_key:
    - review_id
    - order_id

  monthly_key:
    - month

  duplicate_review_keys: prohibited
  duplicate_months: prohibited

denominator_rules:

  text_coverage:
    numerator: text_review_count
    denominator: review_count

  sentiment_rates:
    numerator_population: text-bearing reviews
    denominator: text_review_count

  complaint_rate:
    numerator: complaint_volume
    denominator: text_review_count

  complaint_theme_share:
    numerator_population: complaints
    denominator: complaint_volume

quality_rules:

  - Every source review must retain its review grain.
  - Customer Voice and Complaint Intelligence must join one-to-one on
    review_id + order_id.
  - Textless reviews must not enter sentiment-rate denominators.
  - Textless reviews must not enter complaint-rate denominators.
  - Non-complaints must not be assigned a complaint theme.
  - Unknown complaint classifications must remain distinguishable from
    non-complaints.
  - No duplicate review keys may be introduced.
  - No review may be silently dropped during integration.
  - No causal interpretation is generated by this mart.
  - No presentation-specific calculations are embedded.

lineage:

  review_count:
    source: customer_voice.review_id + customer_voice.order_id
    transformation: distinct review grain count

  text_review_count:
    source: customer_voice.has_review_text
    transformation: count where has_review_text = true

  average_review_score:
    source: customer_voice.review_score
    transformation: monthly arithmetic mean

  positive_review_rate_pct:
    source: customer_voice.sentiment
    transformation: positive text-bearing reviews / text-bearing reviews * 100

  negative_review_rate_pct:
    source: customer_voice.sentiment
    transformation: negative text-bearing reviews / text-bearing reviews * 100

  neutral_review_rate_pct:
    source: customer_voice.sentiment
    transformation: neutral text-bearing reviews / text-bearing reviews * 100

  complaint_volume:
    source: customer_voice_complaints.complaint_flag
    transformation: count where complaint_flag = true

  complaint_rate_pct:
    source: customer_voice_complaints.complaint_flag
    transformation: complaint volume / text-bearing reviews * 100

  complaint_theme_volume:
    source: customer_voice_complaints.complaint_theme
    transformation: count of complaint records by primary theme

  complaint_theme_share_pct:
    source: customer_voice_complaints.complaint_theme
    transformation: theme complaint volume / total complaint volume * 100

exclusions:
  - unsupported_causal_claims
  - demographic_inference
  - identity_inference
  - sentiment_reclassification
  - complaint_reclassification
  - silent_translation
  - silent_deduplication
  - forecasting
  - anomaly_scoring